<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arcade</title><link rel="stylesheet" href="/__arcade_vr/controller.css"></head><body data-mode="debug"><main>
<section class="stage" aria-label="Game views"><div class="views"><div class="live-view"><iframe id="arena" title="Live Arcade game" allow="autoplay; fullscreen; gamepad; xr-spatial-tracking" allowfullscreen src="about:blank"></iframe></div><canvas id="view" width="1920" height="1080" aria-label="Player perspective: drag to look around" tabindex="0"></canvas></div></section>
<section class="tools" aria-label="Controls and diagnostics"><div class="status-row"><span id="connection" role="status">Connecting…</span><span id="feed-state">Loading…</span></div><span id="game-view-label" hidden></span>
<div class="camera-controls"><button id="connect">Reconnect</button><button id="stop">Release controls</button></div><div class="render-options"><label>Resolution<select id="quality" aria-label="Resolution"><option value="low" selected>960 × 540 · Fast</option><option value="balanced">1280 × 720 · Balanced</option><option value="sharp">1920 × 1080 · Sharp</option></select></label><label>Color<select id="tone" aria-label="Color"><option value="neutral">Neutral highlights</option><option value="aces">Cinematic ACES</option></select></label><label>Exposure<input id="exposure" aria-label="Exposure" type="range" min="0.25" max="1.5" step="0.05" value="1"></label></div><div class="control-board"><div><div id="joystick" role="application" aria-label="Movement joystick"><div class="crosshair"></div><div id="stick"></div></div><div class="dpad"><button data-move="0,-1" aria-label="Move forward"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4m-6 6 6-6 6 6"/></svg></button><button data-move="-1,0" aria-label="Move left"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4m6-6-6 6 6 6"/></svg></button><button data-move="0,1" aria-label="Move backward"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16m-6-6 6 6 6-6"/></svg></button><button data-move="1,0" aria-label="Move right"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button></div></div><div class="actions"><button data-key="KeyE">E · Interact</button><div class="pair"><button data-key="Digit6">6 · Game action</button><button data-key="Digit7">7 · Game action</button></div><button data-key="Space">Space · Jump</button><button data-key="ShiftLeft">Shift · Sprint</button><div class="pair"><label>Game key<input id="custom-key" aria-label="Game key" maxlength="1" value="F" size="2"></label><button id="custom-action">Hold game key</button></div><label>Look direction<input id="yaw" type="range" min="-180" max="180" value="0"></label><label>Look up / down<input id="pitch" type="range" min="-70" max="70" value="0"></label></div></div><output id="telemetry">Start the game inside the embed, then connect.</output>
<details><summary>Diagnostics</summary><button id="inspect">Inspect runtime</button><pre id="diagnostics"></pre></details>
</section><div id="loading-state" role="status" aria-live="polite" hidden></div></main><script defer src="/__arcade_vr/controller.js"></script></body></html>
